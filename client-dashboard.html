<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey - Lenses O.S.</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Specific Dashboard CSS -->
    <link rel="stylesheet" href="assets/css/client-portal.css">
</head>
<body>

    <nav class="portal-nav">
        <div class="nav-brand">LENSES O.S. <span class="nav-tag">Client Experience</span></div>
        <div class="nav-user">
            <span id="userNameDisplay">Carregando...</span>
            <button id="logoutBtn" class="btn-logout">Sair</button>
        </div>
    </nav>

    <main class="portal-container" id="dashboardContainer">
        <!-- Dynamic Canvas-style Blocks will be injected here via JS -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>Carregando sua jornada...</p>
        </div>
    </main>

    <script type="module" src="assets/js/client-auth.js"></script>
    <script type="module" src="assets/js/client-dashboard.js"></script>
</body>
</html>
